<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found &mdash; Sawariya Solution</title>
    <link rel="icon" href="./favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Jost', 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #141520;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .wrap { max-width: 560px; }
        .logo { width: 150px; height: auto; margin-bottom: 30px; }
        h1 { font-size: 96px; font-weight: 700; line-height: 1; color: #f85508; }
        h2 { font-size: 28px; font-weight: 500; margin: 12px 0 10px; color: #141520; }
        p { color: #6b6b73; font-size: 17px; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: #f85508;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            padding: 13px 34px;
            border-radius: 10px;
            transition: transform .2s ease;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="wrap">
        <img class="logo" src="./assets/images/uploads/2023/06/logo-nbt.png" alt="Sawariya Solution">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
        <a class="btn" href="./">Back to Home</a>
    </div>
</body>
</html>
