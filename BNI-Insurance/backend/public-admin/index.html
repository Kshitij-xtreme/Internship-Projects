<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | BNI Services</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <img src="/images/logo.png" alt="logo" onerror="this.style.display='none'">
    <h2>Admin Panel</h2>
    <p>Sign in to manage BNI Services website content</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="admin@bniservices.in">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit" style="width:100%;">Login</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
    <div class="hint">Default credentials: <strong>admin@bniservices.in</strong> / <strong>Admin@123</strong><br>(Change these in the backend .env file before deployment)</div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  try{
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if(data.success){
      localStorage.setItem('bni_admin_token', data.token);
      window.location.href = '/admin/dashboard.html';
    } else {
      errorMsg.textContent = data.message || 'Login failed';
    }
  }catch(err){
    errorMsg.textContent = 'Could not connect to server. Make sure backend is running.';
  }
});
</script>
</body>
</html>
